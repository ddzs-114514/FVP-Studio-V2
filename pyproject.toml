[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fvp-studio-v2"
version = "0.2.1"
description = "Isolated multi-target FVP authoring workbench with fail-closed native discovery"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "psutil>=5.9"]
license = {text = "GPL-3.0-or-later"}

[project.scripts]
fvp-studio = "fvp_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fvp_studio*"]
